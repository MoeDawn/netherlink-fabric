# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache
org.gradle.configuration-cache=false

# Fabric 属性（版本在 https://fabricmc.net/develop 查，或看官方示例模组的
# 同名分支 github.com/FabricMC/fabric-example-mod/tree/26.3）
minecraft_version=26.3
loader_version=0.19.5

# ⚠️ 必须写 1.17-SNAPSHOT：这是 Fabric 为「去混淆版 MC」新发的 Loom 线。
# 数字看着比发布版 1.18.2 小，但 1.18.2 **不支持 26.3**（实测报
# "Failed to set up Minecraft"）。SNAPSHOT 需要 settings.gradle 里
# 声明 maven.fabricmc.net 仓库，已经有了。
loom_version=1.17-SNAPSHOT

# Mod 属性
version=0.0.1
group=dev.eyf

# 依赖：Fabric API（注册事件要用）
fabric_api_version=0.161.0+26.3
